      <stop offset="0" stop-color="#0b1a2b"/>
      <stop offset="1" stop-color="#123a56"/>
    </linearGradient>
    <linearGradient id="ds27-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2a8fd8"/>
